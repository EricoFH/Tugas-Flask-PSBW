<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoPrima{% endblock %} | Dealer Mobil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">AutoPrima</a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link" href="{{ url_for('home') }}">Beranda</a>
      <a class="nav-link" href="{{ url_for('cars') }}">Daftar Mobil</a>
      <a class="nav-link" href="{{ url_for('contact') }}">Kontak</a>
    </div>
  </div>
</nav>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}<div class="alert alert-{{ cat }} m-3">{{ m }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
<footer class="bg-dark text-white-50 text-center py-3 mt-5">© 2026 AutoPrima Dealer Mobil</footer>
</body>
</html>
